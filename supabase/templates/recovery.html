<!--
  StreakPact — password-reset email (teal brand).
  Source of truth for the Supabase "Reset Password" template.
  Paste into: Supabase Dashboard → Authentication → Email Templates → Reset Password.
  Supabase injects the link via the {{ .ConfirmationURL }} variable.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f1f5f9;margin:0;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:480px;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #e2e8f0;">
        <!-- Header -->
        <tr>
          <td style="background:#0D9488;padding:28px 32px;text-align:center;">
            <div style="display:inline-block;width:48px;height:48px;line-height:48px;border-radius:14px;background:rgba(255,255,255,0.18);color:#ffffff;font-size:26px;font-weight:800;">S</div>
            <div style="color:#ffffff;font-size:20px;font-weight:800;margin-top:12px;letter-spacing:-0.3px;">StreakPact</div>
            <div style="color:#d1faf4;font-size:12px;margin-top:2px;">两人打卡契约</div>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:32px;">
            <h1 style="margin:0 0 12px;font-size:18px;color:#0f172a;font-weight:800;">重置你的密码</h1>
            <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#475569;">
              我们收到了重置 StreakPact 密码的请求。点击下面的按钮设置新密码。链接将在一段时间后失效。
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
              <tr>
                <td align="center" style="border-radius:14px;background:#0D9488;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:14px;">
                    设置新密码
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#94a3b8;">
              如果不是你本人操作，可忽略此邮件，密码不会改变。<br>
              按钮无法点击时，复制下面的链接到浏览器打开：<br>
              <a href="{{ .ConfirmationURL }}" style="color:#0D9488;word-break:break-all;">{{ .ConfirmationURL }}</a>
            </p>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:16px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;text-align:center;">
            <div style="font-size:11px;color:#94a3b8;">StreakPact · 两人打卡契约</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
