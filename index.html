<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color + favicon are managed at runtime by ThemeChrome so the browser chrome follows
         the active theme (teal / sakura) AND light/dark mode. These are just the pre-paint defaults. -->
    <meta name="theme-color" id="theme-color-meta" content="#0D9488" />
    <link rel="icon" id="app-favicon" type="image/svg+xml" href="/logo.svg" />
    <!-- Apply the saved/system theme before first paint so opening at night doesn't flash white,
         and set a dark chrome color up front so the address bar doesn't flash teal in dark mode. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          var m = document.getElementById("theme-color-meta");
          if (m) m.setAttribute("content", "#11161d");
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StreakPact" />
    <title>StreakPact · 两人打卡契约</title>
    <meta name="description" content="StreakPact — 两人月度打卡契约：设定任务、每日打卡、奖惩兑现，一起变好。" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://streakpact.vercel.app/pwa-512x512.png" />
  </head>

  </body>
</html>
