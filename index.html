    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11161d" />
    <meta name="theme-color" content="#0D9488" />
    <!-- Apply the saved/system theme before first paint so opening at night doesn't flash white. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
